<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#9B1027">
    <title>Sem conexão - DoaPlus</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.75rem; box-sizing: border-box; font-family: system-ui, sans-serif; color: #1D2433; background: #fff; }
        main { max-width: 22rem; }
        svg { width: 2.25rem; height: 2.75rem; color: #D21F3C; }
        h1 { margin: 1rem 0 .5rem; font-size: 2rem; line-height: 1.05; letter-spacing: -.03em; }
        p { margin: 0; line-height: 1.5; color: #5B6474; }
        button { margin-top: 1.5rem; padding: .875rem 1.375rem; border: 0; border-radius: 999px; background: #9B1027; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
        button:hover { background: #7E0C1F; }
    </style>
</head>
<body>
    <main>
        <svg viewBox="0 0 22 28" fill="currentColor" aria-hidden="true"><path d="M11 0S0 11.7 0 17.6a11 11 0 0 0 22 0C22 11.7 11 0 11 0z"/></svg>
        <h1>Você está sem internet.</h1>
        <p>O DoaPlus precisa de conexão para mostrar os hemocentros, a agenda e os alertas. Confira o Wi-Fi ou os dados móveis.</p>
        <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
</body>
</html>
